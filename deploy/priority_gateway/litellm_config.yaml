model_list:
  - model_name: dmv-rag
    litellm_params:
      model: os.environ/LITELLM_MODEL_ID
      api_base: os.environ/LITELLM_UPSTREAM_BASE_URL
      api_key: os.environ/LITELLM_UPSTREAM_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 170
